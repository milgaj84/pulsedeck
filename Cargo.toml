[package]
name = "pulsedeck"
version = "0.11.3"
edition = "2021"
description = "A focused terminal internet radio player with fast search, saved stations, themes, visualizers, and resilient playback"
license = "MIT"
repository = "https://github.com/milgaj84/pulsedeck"
homepage = "https://github.com/milgaj84/pulsedeck"
readme = "README.md"
keywords = ["radio", "tui", "music", "streaming", "catppuccin"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["library.json", ".gitignore", "*.orig"]

[[bin]]
name = "pulsedeck"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio playback
rodio = { version = "0.20", features = ["symphonia-all"] }
cpal = "0.15"
libc = "0.2"

# HTTP + JSON
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML configuration
toml = "0.8"

# Error handling
anyhow = "1.0.103"

# Config directories
dirs = "6"

# Desktop Notifications
notify-rust = "4"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
