[package]
name = "pulsedeck"
version = "1.3.1"
edition = "2021"
rust-version = "1.89"
description = "A focused terminal internet radio player with fast search, saved stations, themes, visualizers, and resilient playback"
license = "MIT"
repository = "https://github.com/milgaj84/pulsedeck"
homepage = "https://github.com/milgaj84/pulsedeck"
readme = "README.md"
keywords = ["radio", "tui", "music", "streaming", "catppuccin"]
categories = ["command-line-utilities", "multimedia::audio"]
exclude = ["library.json", ".gitignore", "*.orig"]

[[bin]]
name = "pulsedeck"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio playback
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
cpal = "0.15"
libc = "0.2"

# HTTP + JSON
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML configuration
toml = "0.8"

# Error handling
anyhow = "1.0.103"

# Config directories
dirs = "6"

# Desktop Notifications
notify-rust = "4"
# Decoding is driven through Symphonia directly (see src/audio/symphonia_backend.rs).
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
symphonia-adapter-libopus = "0.2.9"
oxideav-ac3 = "0.0.11"
oxideav-core = "=0.1.39"

[dev-dependencies]
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
