name: Apply Rustfmt

on:
  push:
    branches:
      - feat/v0.11-release-polish
    paths:
      - .github/workflows/diagnose-ci.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/v0.11-release-polish
          persist-credentials: true

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatter changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git commit -m "style: apply cargo fmt"
          git push origin HEAD:feat/v0.11-release-polish
