name: Refresh anyhow lock

on:
  push:
    branches:
      - feat/v0.11-release-polish
    paths:
      - .github/workflows/refresh-anyhow-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate Cargo.lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/v0.11-release-polish
          persist-credentials: true

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Update anyhow lock entry
        run: cargo update -p anyhow --precise 1.0.103

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already contains anyhow 1.0.103"
            exit 0
          fi
          git commit -m "security: update anyhow lockfile"
          git push origin HEAD:feat/v0.11-release-polish
