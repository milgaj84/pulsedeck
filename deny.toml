# cargo-deny configuration (schema for cargo-deny 0.20.x).
# Run locally with: cargo deny check
# Advisory exceptions are documented in SECURITY.md.

[graph]
all-features = false
no-default-features = false

[advisories]
# Accepted advisory exceptions — each is justified in SECURITY.md.
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# SPDX license identifiers allowed across the dependency tree.
# NOTE: cargo-deny 0.20 requires valid SPDX ids (e.g. "MPL-2.0", not "Mozilla").
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "MIT-0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
